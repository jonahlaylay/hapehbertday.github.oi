<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>main</title>
    <style>
        body {
            background: linear-gradient(#5781d5, #90aadb);
            /* Erases default browser spacing and makes body fill the whole screen */
            margin: 0;
            padding: 0;
            height: 100vh;
            /* Centers the button perfectly horizontally and vertically */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button {
            /* Erases the default white/gray button background and borders */
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
        }

        a {
            /* Increased padding and font-size to make the button bigger */
            padding: 20px 60px;
            font-size: 1.5rem; 
            border: 0;
            border-radius: 50px;
            background: #5781d5;
            color: black;
            text-decoration: none;
            text-align: center;
            font-weight: 700;
            transition: 0.3s ease;
            display: block;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        
        a:hover {
            transform: scale(1.05);
            background: #466dbb;
        }
    </style>
</head>
<body>

    <button>
        <a class="view" href="eyel.html">CLICK HERE</a>
    </button>

</body>
</html>
